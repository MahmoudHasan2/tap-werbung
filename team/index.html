<!DOCTYPE html>
<html lang="de" dir="ltr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<title>TAP Team</title>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Cairo:wght@400;600;700;900&display=swap" rel="stylesheet">
<style>
:root{--bg:#0d0d0f;--panel:#16161a;--panel2:#1e1e24;--line:rgba(255,255,255,.08);--text:#f4f4f5;--muted:#9a9aa5;--purple:#8B5CF6;--purple2:#A78BFA;
--green:#22c55e;--yellow:#eab308;--red:#ef4444;--blue:#3b82f6;--r:14px}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Plus Jakarta Sans','Cairo',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;font-size:14px}
html[lang=ar] body{font-family:'Cairo',sans-serif}
button,input,textarea,select{font:inherit;color:inherit}
.btn{background:var(--purple);color:#fff;border:0;border-radius:10px;padding:9px 16px;cursor:pointer;font-weight:600;white-space:nowrap}
.btn:hover{background:var(--purple2)}.btn.ghost{background:transparent;border:1px solid var(--line)}.btn.ghost:hover{border-color:var(--purple)}
.btn.green{background:var(--green)}.btn.red{background:transparent;border:1px solid rgba(239,68,68,.5);color:#fca5a5}.btn.sm{padding:5px 11px;font-size:12px}
input,textarea,select{width:100%;background:#0f0f12;border:1px solid var(--line);border-radius:10px;padding:10px 12px;outline:none}
input:focus,textarea:focus,select:focus{border-color:var(--purple)}textarea{resize:vertical;min-height:80px}
label{display:block;font-size:12px;color:var(--muted);margin:12px 0 5px}
.muted{color:var(--muted)}.small{font-size:12px}
/* auth */
#auth{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:16px}
.auth-box{background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:30px;width:100%;max-width:440px}
.auth-box h1{font-size:24px;font-weight:800}.auth-box h1 span{color:var(--purple)}
.tabs{display:flex;gap:6px;margin:18px 0 6px}.tabs button{flex:1;background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:9px;cursor:pointer}
.tabs button.on{background:var(--purple);border-color:var(--purple)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:0 10px}
.err{color:#fca5a5;font-size:13px;min-height:18px;margin-top:10px}
.langsw{display:inline-flex;gap:4px}.langsw button{background:transparent;border:1px solid var(--line);border-radius:8px;padding:4px 9px;cursor:pointer;font-size:12px}
.langsw button.on{background:var(--purple);border-color:var(--purple)}
/* app */
#app{display:none}
header{position:sticky;top:0;z-index:10;display:flex;align-items:center;gap:14px;padding:12px 22px;background:rgba(13,13,15,.9);backdrop-filter:blur(12px);border-bottom:1px solid var(--line)}
.logo{font-weight:800;font-size:18px}.logo span{color:var(--purple)}
nav.main{display:flex;gap:4px;flex:1;overflow-x:auto}
nav.main a{padding:8px 13px;border-radius:9px;cursor:pointer;color:var(--muted);white-space:nowrap;position:relative}
nav.main a.on{background:var(--panel2);color:var(--text)}
.badge{background:var(--red);color:#fff;border-radius:10px;font-size:10px;padding:1px 6px;margin-inline-start:5px}
.av{width:34px;height:34px;border-radius:50%;object-fit:cover;background:var(--panel2);display:inline-flex;align-items:center;justify-content:center;font-weight:700;font-size:13px;flex-shrink:0;color:var(--purple2)}
.av.lg{width:96px;height:96px;font-size:32px}
.bell{position:relative;cursor:pointer;font-size:18px;background:none;border:0}
.bell .badge{position:absolute;top:-6px;inset-inline-end:-10px}
main{padding:24px 22px 60px;max-width:1400px;margin:0 auto}
h2{font-size:22px;font-weight:800;margin-bottom:16px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:18px}
/* stats */
.stats{display:grid;grid-template-columns:repeat(5,1fr);gap:12px;margin-bottom:20px}
.stat{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px;cursor:pointer}
.stat b{display:block;font-size:28px;font-weight:800}.stat span{color:var(--muted);font-size:12px}
.stat.overdue b{color:var(--red)}.stat.active b{color:var(--yellow)}.stat.done b{color:var(--green)}.stat.inbox b{color:var(--blue)}
/* board */
.board{display:grid;grid-template-columns:280px 1fr;gap:18px}
.inbox{background:var(--panel);border:1px dashed rgba(59,130,246,.4);border-radius:var(--r);padding:14px;min-height:300px}
.inbox h3,.dept h3{font-size:14px;font-weight:700;display:flex;align-items:center;gap:8px;margin-bottom:10px}
.depts{display:grid;grid-template-columns:repeat(2,1fr);gap:16px}
.dept{border-radius:var(--r);padding:14px;border:2px solid;min-height:210px;transition:.2s;background:var(--panel)}
.dept.green{border-color:rgba(34,197,94,.55);background:linear-gradient(180deg,rgba(34,197,94,.10),var(--panel) 60%)}
.dept.yellow{border-color:rgba(234,179,8,.7);background:linear-gradient(180deg,rgba(234,179,8,.14),var(--panel) 60%)}
.dept.red{border-color:rgba(239,68,68,.75);background:linear-gradient(180deg,rgba(239,68,68,.15),var(--panel) 60%)}
.dept.over,.inbox.over{outline:3px dashed var(--purple);outline-offset:3px}
.dot{width:10px;height:10px;border-radius:50%;display:inline-block}.dot.green{background:var(--green)}.dot.yellow{background:var(--yellow)}.dot.red{background:var(--red)}
.dept .state{font-size:11px;color:var(--muted);margin-inline-start:auto;font-weight:500}
.members{display:flex;margin:4px 0 10px}.members .av{width:26px;height:26px;font-size:10px;border:2px solid var(--panel);margin-inline-end:-6px}
.lock{color:var(--muted);font-size:12px;padding:20px 0;text-align:center}
.task{background:var(--panel2);border:1px solid var(--line);border-radius:11px;padding:10px 12px;margin-bottom:8px;cursor:pointer;border-inline-start:3px solid var(--purple)}
.task[draggable=true]{cursor:grab}.task:hover{border-color:rgba(139,92,246,.5)}
.task.high{border-inline-start-color:var(--red)}.task.low{border-inline-start-color:var(--muted)}
.task .t{font-weight:600;margin-bottom:4px}.task .m{display:flex;gap:8px;font-size:11px;color:var(--muted);flex-wrap:wrap}
.pill{font-size:11px;padding:2px 8px;border-radius:20px;background:var(--panel);border:1px solid var(--line)}
.pill.overdue{color:#fca5a5;border-color:rgba(239,68,68,.5)}.pill.done{color:#86efac;border-color:rgba(34,197,94,.5)}.pill.cancelled{color:var(--muted)}
.pill.inbox{color:#93c5fd}
/* tasks list */
.filters{display:flex;gap:6px;margin-bottom:16px;flex-wrap:wrap}
.filters button{background:var(--panel);border:1px solid var(--line);border-radius:20px;padding:6px 14px;cursor:pointer}
.filters button.on{background:var(--purple);border-color:var(--purple)}
.tlist .task{display:grid;grid-template-columns:1fr auto;align-items:center}
/* modal */
.modal-bg{position:fixed;inset:0;background:rgba(0,0,0,.65);z-index:50;display:none;align-items:flex-start;justify-content:center;padding:40px 16px;overflow-y:auto}
.modal-bg.open{display:flex}
.modal{background:var(--panel);border:1px solid var(--line);border-radius:18px;width:100%;max-width:720px;padding:24px}
.modal h3{font-size:20px;font-weight:800;margin-bottom:6px}
.sec{margin-top:18px}.sec h4{font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.05em;margin-bottom:8px}
.desc{white-space:pre-wrap;line-height:1.7;background:var(--panel2);border-radius:10px;padding:12px}
.file{display:flex;align-items:center;gap:10px;padding:8px 10px;background:var(--panel2);border-radius:9px;margin-bottom:6px}
.file a{color:var(--purple2);text-decoration:none;flex:1;word-break:break-all}
.warnbox{background:rgba(234,179,8,.1);border:1px solid rgba(234,179,8,.4);color:#fde68a;padding:10px 12px;border-radius:10px;font-size:13px;margin-top:10px}
.timeline{border-inline-start:2px solid var(--line);padding-inline-start:14px}
.timeline div{position:relative;padding:4px 0;font-size:12px;color:var(--muted)}
.timeline div:before{content:'';position:absolute;inset-inline-start:-19px;top:10px;width:8px;height:8px;border-radius:50%;background:var(--purple)}
.timeline b{color:var(--text);font-weight:600}
.comment{display:flex;gap:10px;margin-bottom:10px}.comment .b{background:var(--panel2);border-radius:10px;padding:8px 12px;flex:1;white-space:pre-wrap}
.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:20px;justify-content:flex-end}
/* chat */
.chat{display:grid;grid-template-columns:260px 1fr;gap:16px;height:calc(100vh - 150px)}
.threads{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);overflow-y:auto;padding:8px}
.thread{display:flex;align-items:center;gap:10px;padding:9px;border-radius:10px;cursor:pointer}
.thread:hover{background:var(--panel2)}.thread.on{background:var(--purple)}
.thread .n{flex:1;min-width:0}.thread .n div{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.conv{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);display:flex;flex-direction:column;min-height:0}
.conv-h{padding:14px 18px;border-bottom:1px solid var(--line);font-weight:700}
.msgs{flex:1;overflow-y:auto;padding:16px 18px;display:flex;flex-direction:column;gap:10px}
.msg{display:flex;gap:9px;max-width:78%}.msg.mine{align-self:flex-end;flex-direction:row-reverse}
.msg .b{background:var(--panel2);border-radius:14px;padding:8px 13px;white-space:pre-wrap;word-break:break-word}
.msg.mine .b{background:var(--purple)}.msg .who{font-size:11px;color:var(--muted);margin-bottom:2px}
.composer{display:flex;gap:8px;padding:12px;border-top:1px solid var(--line)}.composer input{flex:1}
/* team */
.people{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:14px}
.person{display:flex;gap:12px;align-items:center}.person .av{width:52px;height:52px;font-size:18px}
.role{font-size:11px;color:var(--purple2)}
/* notif panel */
#notifPanel{position:fixed;top:62px;inset-inline-end:16px;width:340px;max-height:70vh;overflow-y:auto;background:var(--panel);border:1px solid var(--line);border-radius:14px;z-index:40;display:none;padding:8px;box-shadow:0 20px 60px rgba(0,0,0,.5)}
#notifPanel.open{display:block}
.notif{padding:10px;border-radius:10px;font-size:13px;cursor:pointer;line-height:1.5}.notif:hover{background:var(--panel2)}
.notif.unread{border-inline-start:3px solid var(--purple)}.notif.warn{color:#fde68a}
.toast{position:fixed;bottom:20px;inset-inline-start:20px;background:var(--panel2);border:1px solid var(--line);padding:12px 18px;border-radius:12px;opacity:0;transition:.3s;z-index:90;pointer-events:none}
.toast.show{opacity:1}
@media(max-width:1000px){.board{grid-template-columns:1fr}.stats{grid-template-columns:repeat(3,1fr)}.chat{grid-template-columns:1fr;height:auto}.threads{max-height:200px}.conv{height:65vh}}
@media(max-width:640px){.depts{grid-template-columns:1fr}.stats{grid-template-columns:repeat(2,1fr)}header{padding:10px 12px;flex-wrap:wrap}main{padding:16px 12px 60px}.grid2{grid-template-columns:1fr}}
</style>
</head>
<body>

<!-- ============ AUTH ============ -->
<div id="auth">
  <div class="auth-box">
    <div style="display:flex;justify-content:space-between;align-items:center"><h1>T.A.P <span>Team</span></h1><div class="langsw"></div></div>
    <div class="tabs"><button data-tab="login" class="on" data-t="login"></button><button data-tab="register" data-t="register"></button></div>
    <form id="loginForm">
      <label data-t="username"></label><input id="lgU" autocomplete="username" dir="ltr" required>
      <label data-t="password"></label><input id="lgP" type="password" autocomplete="current-password" dir="ltr" required>
      <button class="btn" style="width:100%;margin-top:18px" data-t="login"></button>
    </form>
    <form id="regForm" style="display:none">
      <label data-t="code"></label><input id="rgCode" dir="ltr" placeholder="TAP-XXXX-XXXX" required>
      <div class="grid2"><div><label data-t="first"></label><input id="rgFirst" required></div><div><label data-t="last"></label><input id="rgLast" required></div></div>
      <div class="grid2"><div><label data-t="phone"></label><input id="rgPhone" dir="ltr" required></div><div><label data-t="email"></label><input id="rgEmail" type="email" dir="ltr" required></div></div>
      <label data-t="dept_pick"></label><select id="rgDept"></select>
      <div class="grid2"><div><label data-t="username"></label><input id="rgUser" dir="ltr" autocomplete="username" required></div><div><label data-t="password"></label><input id="rgPass" type="password" dir="ltr" autocomplete="new-password" required></div></div>
      <button class="btn" style="width:100%;margin-top:18px" data-t="register"></button>
    </form>
    <div class="err" id="authErr"></div>
  </div>
</div>

<!-- ============ APP ============ -->
<div id="app">
  <header>
    <div class="logo">T.A.P <span>Team</span></div>
    <nav class="main">
      <a data-view="board" data-t="nav_board"></a>
      <a data-view="tasks" data-t="nav_tasks"></a>
      <a data-view="chat"><span data-t="nav_chat"></span><span class="badge" id="chatBadge" hidden></span></a>
      <a data-view="team" data-t="nav_team"></a>
      <a data-view="profile" data-t="nav_profile"></a>
    </nav>
    <div class="langsw"></div>
    <button class="bell" id="bell">🔔<span class="badge" id="notifBadge" hidden></span></button>
    <span id="meAv"></span>
    <button class="btn ghost sm" id="logout" data-t="logout"></button>
  </header>
  <div id="notifPanel"></div>
  <main id="view"></main>
</div>

<div class="modal-bg" id="modalBg"><div class="modal" id="modal"></div></div>
<input type="file" id="fileIn" hidden>
<div class="toast" id="toast"></div>

  return d;
}

  const unreadFrom = id => MSGS.filter(m => m.from === id && m.to === S.me.id && m.id > (window['seen_' + id] || 0)).length;
  $('#view').innerHTML = `<div class="chat"><div class="threads">
      <div class="thread ${CHAT === 'public' ? 'on' : ''}" data-c="public"><span class="av">#</span><div class="n"><div><b>${t('public_chat')}</b></div><div class="muted small">${t('public_desc')}</div></div></div>
      <div class="muted small" style="padding:10px 8px 4px">${t('private')} · ${isAdmin(S.me) ? '' : t('only_mgmt')}</div>
      ${th.map(u => `<div class="thread ${CHAT === u.id ? 'on' : ''}" data-c="${u.id}">${avatar(u)}<div class="n"><div>${esc(fullName(u))}</div><div class="muted small">${t('r_' + u.role)}${u.dept ? ' · ' + t('d_' + u.dept) : ''}</div></div></div>`).join('')}
    </div><div class="conv"><div class="conv-h" id="convH"></div><div class="msgs" id="msgs"></div>
      <div class="composer"><input id="msgIn" placeholder="${t('type_msg')}" maxlength="3000"><button class="btn" id="msgSend">${t('send')}</button></div></div></div>`;
  document.querySelectorAll('.thread').forEach(el => el.onclick = () => { CHAT = el.dataset.c === 'public' ? 'public' : +el.dataset.c; renderChat(); });
  $('#convH').textContent = CHAT === 'public' ? t('public_chat') : '🔒 ' + fullName(user(CHAT));
  const send = async () => {
    const v = $('#msgIn').value.trim(); if (!v) return;
    $('#msgIn').value = '';
    await api('chat_send', { to: CHAT, text: v }); await refresh(); renderChatMsgs(true);
  };
  $('#msgSend').onclick = send; $('#msgIn').onkeydown = e => { if (e.key === 'Enter') send(); };
  renderChatMsgs(true); $('#msgIn').focus();
}
function renderChatMsgs(scroll) {
  const box = $('#msgs'); if (!box) return;
  seenChat = lastMsgId; $('#chatBadge').hidden = true;
  const atBottom = box.scrollHeight - box.scrollTop - box.clientHeight < 60;
  box.innerHTML = convMsgs().map(m => { const u = user(m.from), mine = m.from === S.me.id;
    return `<div class="msg ${mine ? 'mine' : ''}">${avatar(u)}<div><div class="who">${mine ? '' : esc(fullName(u)) + ' · '}${fmtDate(m.at)}</div><div class="b">${esc(m.text)}</div></div></div>`; }).join('');
  if (scroll || atBottom) box.scrollTop = box.scrollHeight;
}

/* ================= team ================= */
function renderTeam() {
  const groups = [['mgmt', S.users.filter(u => u.role === 'manager')]].concat(DEPTS.map(d => [d, S.users.filter(u => u.dept === d)]));
  $('#view').innerHTML = `<h2>${t('nav_team')}</h2>` + groups.map(([g, us]) => `<div class="card" style="margin-bottom:14px">
    <h3 style="margin-bottom:12px">${g === 'mgmt' ? '👑 ' + t('r_manager') : DEPT_ICON[g] + ' ' + t('d_' + g)} <span class="muted small">· ${us.length} ${t('members_count')}</span></h3>
    <div class="people">${us.map(u => `<div class="person">${avatar(u)}<div><b>${esc(fullName(u))}</b><div class="role">${t('r_' + u.role)}</div>
      <div class="muted small" dir="ltr">${esc(u.phone)}</div><div class="muted small" dir="ltr">${esc(u.email)}</div></div></div>`).join('') || `<span class="muted small">—</span>`}</div></div>`).join('');
}

/* ================= profile ================= */
function renderProfile() {
  const u = S.me;
  $('#view').innerHTML = `<h2>${t('profile')}</h2><div class="card" style="max-width:560px">
    <div style="display:flex;gap:18px;align-items:center">${avatar(u, 'lg')}<div><b style="font-size:18px">${esc(fullName(u))}</b><div class="role">${t('r_' + u.role)}${u.dept ? ' · ' + t('d_' + u.dept) : ''}</div>
      <div class="muted small" dir="ltr">@${esc(u.username)}</div><button class="btn ghost sm" id="avBtn" style="margin-top:8px">📷 ${t('change_photo')}</button></div></div>
    <div class="grid2"><div><label>${t('first')}</label><input id="pfF" value="${esc(u.first)}"></div><div><label>${t('last')}</label><input id="pfL" value="${esc(u.last)}"></div></div>
    <div class="grid2"><div><label>${t('phone')}</label><input id="pfP" dir="ltr" value="${esc(u.phone)}"></div><div><label>${t('email')}</label><input id="pfE" dir="ltr" type="email" value="${esc(u.email)}"></div></div>
    <div class="grid2"><div><label>${t('cur_pass')}</label><input id="pfC" type="password" dir="ltr" autocomplete="current-password"></div><div><label>${t('new_pass')}</label><input id="pfN" type="password" dir="ltr" autocomplete="new-password"></div></div>
    <div class="actions"><button class="btn" id="pfS">${t('save')}</button></div></div>`;
  $('#pfS').onclick = async () => {
    try {
      await api('profile', { first: $('#pfF').value, last: $('#pfL').value, phone: $('#pfP').value, email: $('#pfE').value, currentPassword: $('#pfC').value, newPassword: $('#pfN').value });
      toast(t('saved')); await refresh(); renderProfile();
    } catch (e) { toast(errText(e)); }
  };
  $('#avBtn').onclick = () => {
    const fi = $('#fileIn'); fi.accept = 'image/*'; fi.value = '';
    fi.onchange = async () => { if (!fi.files[0]) return; const fd = new FormData(); fd.append('file', fi.files[0]);
      try { await api('avatar_upload', fd, true); toast(t('saved')); await refresh(); renderProfile(); } catch (e) { toast('✕ ' + e.code); } fi.accept = ''; };
    fi.click();
  };
}

/* ================= notifications ================= */
$('#bell').onclick = async () => {
  const p = $('#notifPanel'); p.classList.toggle('open');
  if (!p.classList.contains('open')) return;
  const list = S.notifs.slice().reverse();
  p.innerHTML = `<div style="padding:8px 10px;font-weight:700">${t('notifs')}</div>` + (list.map(n =>
    `<div class="notif ${n.read ? '' : 'unread'} ${n.type === 'files_warning' ? 'warn' : ''}" data-task="${n.data.task || ''}">${esc(t('n_' + n.type, { t: n.data.title || '' }))}<div class="muted small">${fmtDate(n.at)}</div></div>`).join('') || `<div class="notif muted">${t('no_notifs')}</div>`);
  p.querySelectorAll('.notif[data-task]').forEach(el => el.onclick = () => { p.classList.remove('open'); if (el.dataset.task) openTask(+el.dataset.task); });
  if (S.notifs.some(n => !n.read)) { await api('notifs_read', {}); S.notifs.forEach(n => n.read = true); $('#notifBadge').hidden = true; }
};
document.addEventListener('click', e => { if (!e.target.closest('#notifPanel,#bell')) $('#notifPanel').classList.remove('open'); });
</script>
</body>
</html>
