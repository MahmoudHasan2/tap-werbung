    <style>
        :root {
            --primary: #6366f1;
            --primary-dark: #4f46e5;
            --secondary: #ec4899;
            --accent: #06b6d4;
            --success: #22c55e;
            --warning: #f59e0b;
            --danger: #ef4444;
            --dark: #0f172a;
            --dark-light: #1e293b;
            --dark-lighter: #334155;
            --gray: #64748b;
            --light: #f8fafc;
            --white: #ffffff;
            --gradient-1: linear-gradient(135deg, #6366f1 0%, #8b5cf6 50%, #ec4899 100%);
            --shadow: 0 4px 6px -1px rgba(0,0,0,0.1), 0 2px 4px -2px rgba(0,0,0,0.1);
            --shadow-lg: 0 10px 15px -3px rgba(0,0,0,0.1), 0 4px 6px -4px rgba(0,0,0,0.1);
            --shadow-xl: 0 20px 25px -5px rgba(0,0,0,0.1), 0 8px 10px -6px rgba(0,0,0,0.1);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Tajawal', sans-serif;
            background: var(--dark);
            color: var(--white);
            min-height: 100vh;
            overflow-x: hidden;
        }

        /* ===== EDITOR LAYOUT ===== */
        .editor-container {
            display: flex;
            height: 100vh;
        }

        /* ===== SIDEBAR ===== */
        .sidebar {
            width: 320px;
            background: var(--dark-light);
            border-left: 1px solid rgba(255,255,255,0.05);
            display: flex;
            flex-direction: column;
            z-index: 100;
        }

        .sidebar-header {
            padding: 20px;
            border-bottom: 1px solid rgba(255,255,255,0.05);
        }

        .sidebar-logo {
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 22px;
            font-weight: 900;
            background: var(--gradient-1);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .sidebar-logo i {
            width: 36px;
            height: 36px;
            background: var(--gradient-1);
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 16px;
            color: white;
            -webkit-text-fill-color: white;
        }

        .sidebar-subtitle {
            font-size: 13px;
            color: var(--gray);
            margin-top: 4px;
        }

        .sidebar-tabs {
            display: flex;
            gap: 4px;
            padding: 12px 16px;
            border-bottom: 1px solid rgba(255,255,255,0.05);
        }

        .sidebar-tab {
            flex: 1;
            padding: 10px;
            background: transparent;
            border: 1px solid rgba(255,255,255,0.1);
            color: var(--gray);
            border-radius: 10px;
            font-family: 'Tajawal', sans-serif;
            font-size: 13px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .sidebar-tab.active {
            background: var(--primary);
            color: white;
            border-color: var(--primary);
        }

        .sidebar-tab:hover:not(.active) {
            background: rgba(255,255,255,0.05);
            color: var(--white);
        }

        .sidebar-content {
            flex: 1;
            overflow-y: auto;
            padding: 16px;
        }

        .sidebar-content::-webkit-scrollbar { width: 6px; }
        .sidebar-content::-webkit-scrollbar-track { background: transparent; }
        .sidebar-content::-webkit-scrollbar-thumb { background: var(--dark-lighter); border-radius: 3px; }

        .edit-section {
            margin-bottom: 24px;
        }

        .edit-section-title {
            font-size: 13px;
            font-weight: 700;
            color: var(--gray);
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 12px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .edit-section-title i {
            color: var(--primary);
        }

        .edit-group {
            margin-bottom: 16px;
        }

        .edit-label {
            display: block;
            font-size: 13px;
            font-weight: 600;
            color: var(--gray);
            margin-bottom: 6px;
        }

        .edit-input {
            width: 100%;
            padding: 12px 14px;
            background: var(--dark);
            border: 1px solid rgba(255,255,255,0.1);
            border-radius: 10px;
            color: var(--white);
            font-family: 'Tajawal', sans-serif;
            font-size: 14px;
            transition: all 0.3s ease;
        }

        .edit-input:focus {
            outline: none;
            border-color: var(--primary);
            box-shadow: 0 0 0 3px rgba(99,102,241,0.1);
        }

        .edit-input::placeholder {
            color: var(--gray);
            opacity: 0.5;
        }

        .edit-textarea {
            min-height: 80px;
            resize: vertical;
        }

        .image-upload {
            position: relative;
            border: 2px dashed rgba(255,255,255,0.15);
            border-radius: 12px;
            padding: 30px;
            text-align: center;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .image-upload:hover {
            border-color: var(--primary);
            background: rgba(99,102,241,0.05);
        }

        .image-upload i {
            font-size: 32px;
            color: var(--gray);
            margin-bottom: 10px;
        }

        .image-upload-text {
            font-size: 13px;
            color: var(--gray);
        }

        .image-upload input {
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            opacity: 0;
            cursor: pointer;
        }

        .image-preview {
            width: 100%;
            border-radius: 10px;
            margin-top: 10px;
            display: none;
        }

        .image-preview.show {
            display: block;
        }

        .color-picker-wrapper {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .color-picker {
            width: 40px;
            height: 40px;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            background: transparent;
        }

        .color-value {
            font-size: 13px;
            color: var(--gray);
            font-family: monospace;
        }

        /* ===== SIDEBAR FOOTER ===== */
        .sidebar-footer {
            padding: 16px;
            border-top: 1px solid rgba(255,255,255,0.05);
        }

        .btn-save {
            width: 100%;
            padding: 16px;
            background: var(--gradient-1);
            color: white;
            border: none;
            border-radius: 12px;
            font-family: 'Tajawal', sans-serif;
            font-size: 16px;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            box-shadow: 0 4px 15px rgba(99,102,241,0.4);
        }

        .btn-save:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 25px rgba(99,102,241,0.5);
        }

        .btn-save:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
        }

        .btn-save i {
            animation: none;
        }

        .btn-save.loading i {
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }

        /* ===== PREVIEW AREA ===== */
        .preview-area {
            flex: 1;
            display: flex;
            flex-direction: column;
            background: var(--dark);
        }

        .preview-toolbar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px 20px;
            background: var(--dark-light);
            border-bottom: 1px solid rgba(255,255,255,0.05);
        }

        .preview-toolbar-left {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .preview-toolbar-title {
            font-size: 15px;
            font-weight: 700;
        }

        .preview-toolbar-title span {
            color: var(--primary);
        }

        .device-toggle {
            display: flex;
            gap: 4px;
            background: var(--dark);
            padding: 4px;
            border-radius: 10px;
        }

        .device-btn {
            padding: 8px 14px;
            background: transparent;
            border: none;
            color: var(--gray);
            border-radius: 8px;
            font-family: 'Tajawal', sans-serif;
            font-size: 13px;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .device-btn.active {
            background: var(--primary);
            color: white;
        }

        .preview-toolbar-right {
            display: flex;
            gap: 8px;
        }

        .toolbar-btn {
            padding: 8px 16px;
            background: var(--dark);
            border: 1px solid rgba(255,255,255,0.1);
            color: var(--gray);
            border-radius: 8px;
            font-family: 'Tajawal', sans-serif;
            font-size: 13px;
            cursor: pointer;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .toolbar-btn:hover {
            background: rgba(255,255,255,0.05);
            color: var(--white);
        }

        .toolbar-btn.primary {
            background: var(--success);
            color: white;
            border-color: var(--success);
        }

        .toolbar-btn.primary:hover {
            background: #16a34a;
        }

        .preview-frame-container {
            flex: 1;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: flex-start;
            overflow: auto;
            background: 
                linear-gradient(45deg, var(--dark) 25%, transparent 25%),
                linear-gradient(-45deg, var(--dark) 25%, transparent 25%),
                linear-gradient(45deg, transparent 75%, var(--dark) 75%),
                linear-gradient(-45deg, transparent 75%, var(--dark) 75%);
            background-size: 20px 20px;
            background-position: 0 0, 0 10px, 10px -10px, -10px 0px;
            background-color: var(--dark-lighter);
        }

        .preview-frame {
            width: 100%;
            max-width: 1400px;
            height: calc(100vh - 140px);
            border: none;
            border-radius: 12px;
            background: white;
            box-shadow: var(--shadow-xl);
            transition: all 0.3s ease;
        }

        .preview-frame.mobile {
            max-width: 375px;
        }

        .preview-frame.tablet {
            max-width: 768px;
        }

        /* ===== MODAL ===== */
        .modal-overlay {
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0,0,0,0.8);
            backdrop-filter: blur(10px);
            z-index: 1000;
            display: none;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .modal-overlay.show {
            display: flex;
            animation: fadeIn 0.3s ease;
        }

        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        .modal {
            background: var(--dark-light);
            border-radius: 24px;
            width: 100%;
            max-width: 500px;
            padding: 40px;
            text-align: center;
            border: 1px solid rgba(255,255,255,0.05);
            animation: slideUp 0.4s ease;
        }

        @keyframes slideUp {
            from { opacity: 0; transform: translateY(30px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .modal-icon {
            width: 80px;
            height: 80px;
            background: var(--gradient-1);
            border-radius: 24px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 36px;
            color: white;
            margin: 0 auto 24px;
        }

        .modal-icon.success {
            background: linear-gradient(135deg, var(--success) 0%, #16a34a 100%);
        }

        .modal h2 {
            font-size: 28px;
            font-weight: 900;
            margin-bottom: 12px;
        }

        .modal p {
            color: var(--gray);
            font-size: 16px;
            line-height: 1.7;
            margin-bottom: 24px;
        }

        .qr-container {
            background: white;
            padding: 20px;
            border-radius: 16px;
            display: inline-block;
            margin-bottom: 20px;
        }

        .qr-container canvas {
            display: block;
        }

        .site-url {
            background: var(--dark);
            padding: 12px 20px;
            border-radius: 10px;
            font-family: monospace;
            font-size: 14px;
            color: var(--primary);
            margin-bottom: 20px;
            word-break: break-all;
        }

        .modal-actions {
            display: flex;
            gap: 12px;
        }

        .modal-actions button {
            flex: 1;
            padding: 14px;
            border-radius: 12px;
            font-family: 'Tajawal', sans-serif;
            font-size: 15px;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.3s ease;
            border: none;
        }

        .modal-btn-primary {
            background: var(--gradient-1);
            color: white;
            box-shadow: 0 4px 15px rgba(99,102,241,0.4);
        }

        .modal-btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 25px rgba(99,102,241,0.5);
        }

        .modal-btn-secondary {
            background: rgba(255,255,255,0.05);
            color: var(--white);
            border: 1px solid rgba(255,255,255,0.1) !important;
        }

        .modal-btn-secondary:hover {
            background: rgba(255,255,255,0.1);
        }

        /* ===== LOADING OVERLAY ===== */
        .loading-overlay {
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: var(--dark);
            z-index: 2000;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            gap: 24px;
        }

        .loading-overlay.hidden {
            display: none;
        }

        .loading-spinner {
            width: 60px;
            height: 60px;
            border: 3px solid rgba(99,102,241,0.2);
            border-top-color: var(--primary);
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }

        .loading-text {
            font-size: 18px;
            color: var(--gray);
        }

        /* ===== TOAST ===== */
        .toast {
            position: fixed;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%) translateY(100px);
            background: var(--dark-light);
            border: 1px solid rgba(255,255,255,0.1);
            padding: 16px 28px;
            border-radius: 12px;
            display: flex;
            align-items: center;
            gap: 12px;
            font-size: 14px;
            font-weight: 600;
            z-index: 3000;
            opacity: 0;
            transition: all 0.4s ease;
            box-shadow: var(--shadow-lg);
        }

        .toast.show {
            transform: translateX(-50%) translateY(0);
            opacity: 1;
        }

        .toast.success { border-color: var(--success); }
        .toast.success i { color: var(--success); }
        .toast.error { border-color: var(--danger); }
        .toast.error i { color: var(--danger); }

        /* ===== RESPONSIVE ===== */
        @media (max-width: 1024px) {
            .sidebar { width: 280px; }
        }

        @media (max-width: 768px) {
            .editor-container { flex-direction: column; }
            .sidebar { width: 100%; height: auto; max-height: 50vh; }
            .preview-frame { height: 50vh; }
        }
    </style>

<body>
    <!-- Loading Overlay -->
    <div class="loading-overlay" id="loadingOverlay">
        <div class="loading-spinner"></div>
        <div class="loading-text">جاري تحميل المحرر...</div>
    </div>

    <div class="editor-container">
        <!-- SIDEBAR -->
        <aside class="sidebar">
            <div class="sidebar-header">
                <div class="sidebar-logo">
                    <i class="fas fa-pen-fancy"></i>
                    Taplify Editor
                </div>
                <div class="sidebar-subtitle" id="templateName">قالب: صالون التجميل</div>
            </div>

            <div class="sidebar-tabs">
                <button class="sidebar-tab active" onclick="switchTab('content')">
                    <i class="fas fa-edit"></i> المحتوى
                </button>
                <button class="sidebar-tab" onclick="switchTab('images')">
                    <i class="fas fa-image"></i> الصور
                </button>
                <button class="sidebar-tab" onclick="switchTab('settings')">
                    <i class="fas fa-cog"></i> الإعدادات
                </button>
            </div>

            <div class="sidebar-content" id="sidebarContent">
                <!-- Content will be populated by JS -->
            </div>

            <div class="sidebar-footer">
                <button class="btn-save" id="saveBtn" onclick="saveAndPublish()">
                    <i class="fas fa-check-circle"></i>
                    حفظ ونشر الموقع
                </button>
            </div>
        </aside>

        <!-- PREVIEW AREA -->
        <main class="preview-area">
            <div class="preview-toolbar">
                <div class="preview-toolbar-left">
                    <div class="preview-toolbar-title">
                        معاينة <span id="previewTemplateName">القالب</span>
                    </div>
                    <div class="device-toggle">
                        <button class="device-btn active" onclick="setDevice('desktop')" title="Desktop">
                            <i class="fas fa-desktop"></i>
                        </button>
                        <button class="device-btn" onclick="setDevice('tablet')" title="Tablet">
                            <i class="fas fa-tablet-alt"></i>
                        </button>
                        <button class="device-btn" onclick="setDevice('mobile')" title="Mobile">
                            <i class="fas fa-mobile-alt"></i>
                        </button>
                    </div>
                </div>
                <div class="preview-toolbar-right">
                    <button class="toolbar-btn" onclick="refreshPreview()">
                        <i class="fas fa-sync-alt"></i> تحديث
                    </button>
                    <button class="toolbar-btn" onclick="openLivePreview()" style="background: var(--accent); color: white; border-color: var(--accent);">
                        <i class="fas fa-eye"></i> معاينة
                    </button>
                    <button class="toolbar-btn primary" onclick="saveAndPublish()">
                        <i class="fas fa-rocket"></i> نشر
                    </button>
                </div>
            </div>
            <div class="preview-frame-container">
                <iframe class="preview-frame" id="previewFrame" src="about:blank"></iframe>
            </div>
        </main>
    </div>

    <!-- Success Modal -->
    <div class="modal-overlay" id="successModal">
        <div class="modal">
            <div class="modal-icon success">
                <i class="fas fa-check"></i>
            </div>
            <h2>تم نشر موقعك بنجاح!</h2>
            <p>موقعك جاهز الآن. يمكنك مشاركته مع عملائك عبر الرابط أو QR Code.</p>
            <div class="qr-container" id="qrCodeContainer"></div>
            <div class="site-url" id="siteUrl">https://taplify.com/s/your-site</div>
            <div class="modal-actions">
                <button class="modal-btn-primary" onclick="copyUrl()">
                    <i class="fas fa-copy"></i> نسخ الرابط
                </button>
                <button class="modal-btn-secondary" onclick="closeModal()">
                    <i class="fas fa-times"></i> إغلاق
                </button>
            </div>
        </div>
    </div>

    <!-- Toast -->
    <div class="toast" id="toast">
        <i class="fas fa-check-circle"></i>
        <span id="toastMessage">تم الحفظ بنجاح!</span>
    </div>

    <script>
        // ===== FIREBASE CONFIG =====
        const firebaseConfig = {
            databaseURL: "https://your-firebase-project-default-rtdb.europe-west1.firebasedatabase.app"
        };

        // Initialize Firebase
        firebase.initializeApp(firebaseConfig);
        const database = firebase.database();
        const storage = firebase.storage();

        // ===== STATE =====
        let currentTemplate = 'landing';
        let siteData = {};
        let uploadedImages = {};
        let siteId = null;

        // ===== TEMPLATE CONFIGS =====
        // ===== DYNAMIC TEMPLATE CONFIG LOADER =====
// Automatically extracts data-editable fields from any template HTML file

let templateConfigs = {}; // Will be populated dynamically

async function loadTemplateConfig(templateName) {
    try {
        const response = await fetch(`template-${templateName}.html`);
        if (!response.ok) throw new Error('Template not found');
        const html = await response.text();

        // Parse HTML
        const parser = new DOMParser();
        const doc = parser.parseFromString(html, 'text/html');

        // Extract all data-editable elements
        const elements = doc.querySelectorAll('[data-editable]');

        const content = [];
        const images = [];
        const seenIds = new Set();

        elements.forEach(el => {
            const id = el.getAttribute('data-editable');
            if (!id || seenIds.has(id)) return;
            seenIds.add(id);

            const isImage = el.getAttribute('data-type') === 'image' || el.tagName === 'IMG';
            const tagName = el.tagName;
            const textLength = el.textContent ? el.textContent.trim().length : 0;

            // Detect input type
            let type = 'text';
            if (isImage) {
                images.push({
                    id: id,
                    label: formatLabel(id),
                    section: detectSection(el, doc)
                });
            } else {
                if (tagName === 'TEXTAREA' || textLength > 80) {
                    type = 'textarea';
                }
                content.push({
                    id: id,
                    label: formatLabel(id),
                    type: type,
                    section: detectSection(el, doc)
                });
            }
        });

        return {
            name: formatTemplateName(templateName),
            file: `template-${templateName}.html`,
            fields: { content, images }
        };
    } catch (error) {
        console.error('Error loading template config:', error);
        return null;
    }
}

// Helper: Convert camelCase/IDs to readable labels
function formatLabel(id) {
    return id
        .replace(/([A-Z])/g, ' $1')
        .replace(/^./, str => str.toUpperCase())
        .trim();
}

// Helper: Format template name for display
function formatTemplateName(name) {
    const names = {
        'landing': 'صالون التجميل',
        'multi': 'شركة المقاولات',
        'medical': 'Nuvica Medical',
        'barber': 'Barbuit Shop - Herrenfriseur'
    };
    return names[name] || name.charAt(0).toUpperCase() + name.slice(1);
}

// Helper: Detect which section an element belongs to
function detectSection(el, doc) {
    // Try to find parent section with id
    let parent = el.parentElement;
    let depth = 0;
    while (parent && depth < 10) {
        if (parent.id) {
            return formatSectionName(parent.id);
        }
        // Check for section/hero/main tags
        const tag = parent.tagName.toLowerCase();
        if (['section', 'header', 'footer', 'main'].includes(tag)) {
            const sectionId = parent.id || parent.className || tag;
            return formatSectionName(sectionId);
        }
        parent = parent.parentElement;
        depth++;
    }
    return 'General';
}

// Helper: Format section name
function formatSectionName(id) {
    const sectionNames = {
        'home': 'الصفحة الرئيسية',
        'hero': 'الصفحة الرئيسية',
        'services': 'الخدمات',
        'pricing': 'الأسعار',
        'preise': 'الأسعار',
        'team': 'الفريق',
        'about': 'من نحن',
        'features': 'الميزات',
        'gallery': 'المعرض',
        'contact': 'التواصل',
        'kontakt': 'التواصل',
        'testimonials': 'التقييمات',
        'footer': 'الفوتر',
        'navbar': 'الهيدر',
        'nav': 'الهيدر',
        'header': 'الهيدر'
    };

    // Try exact match
    if (sectionNames[id]) return sectionNames[id];

    // Try partial match
    for (const [key, value] of Object.entries(sectionNames)) {
        if (id.includes(key)) return value;
    }

    // Default: format the id
    return id.replace(/([A-Z])/g, ' $1').replace(/^./, str => str.toUpperCase()).trim();
}

// ===== INITIALIZATION =====
        
// Helper: Detect template language from HTML lang attribute
async function detectTemplateLanguage(templateName) {
    try {
        const response = await fetch(`template-${templateName}.html`);
        const html = await response.text();
        const langMatch = html.match(/<html[^>]*lang="([^"]+)"/);
        return langMatch ? langMatch[1] : 'ar';
    } catch {
        return 'ar';
    }
}

async function init() {
            const urlParams = new URLSearchParams(window.location.search);
            currentTemplate = urlParams.get('template') || localStorage.getItem('selectedTemplate') || 'landing';

            // Load template config dynamically
            const config = await loadTemplateConfig(currentTemplate);
            if (!config) {
                showToast('خطأ في تحميل القالب!', 'error');
                document.getElementById('loadingOverlay').classList.add('hidden');
                return;
            }

            // Store in templateConfigs for other functions
            templateConfigs[currentTemplate] = config;

            document.getElementById('templateName').textContent = 'قالب: ' + config.name;
            document.getElementById('previewTemplateName').textContent = config.name;

            // Generate site ID
            siteId = 'site_' + Date.now() + '_' + Math.random().toString(36).substr(2, 9);

            // Initialize default data
            initializeDefaultData();

            // Render sidebar
            renderSidebar('content');

            // Load preview
            loadPreview();

            // Hide loading
            setTimeout(() => {
                document.getElementById('loadingOverlay').classList.add('hidden');
            }, 1000);
        }

        function initializeDefaultData() {
            const config = templateConfigs[currentTemplate];
            siteData = {
                template: currentTemplate,
                createdAt: new Date().toISOString(),
                content: {},
                images: {}
            };

            // Initialize content fields
            config.fields.content.forEach(field => {
                siteData.content[field.id] = '';
            });

            // Initialize image fields
            config.fields.images.forEach(field => {
                siteData.images[field.id] = '';
            });
        }

        // ===== SIDEBAR RENDERING =====
        function renderSidebar(tab) {
            const config = templateConfigs[currentTemplate];
            const container = document.getElementById('sidebarContent');
            let html = '';

            if (tab === 'content') {
                const sections = {};
                config.fields.content.forEach(field => {
                    if (!sections[field.section]) sections[field.section] = [];
                    sections[field.section].push(field);
                });

                for (const [sectionName, fields] of Object.entries(sections)) {
                    html += `<div class="edit-section">`;
                    html += `<div class="edit-section-title"><i class="fas fa-layer-group"></i> ${sectionName}</div>`;
                    fields.forEach(field => {
                        const value = siteData.content[field.id] || '';
                        if (field.type === 'textarea') {
                            html += `
                                <div class="edit-group">
                                    <label class="edit-label">${field.label}</label>
                                    <textarea class="edit-input edit-textarea" 
                                        data-field="${field.id}" 
                                        placeholder="${field.label}..."
                                        oninput="updateContent('${field.id}', this.value)">${value}</textarea>
                                </div>
                            `;
                        } else {
                            html += `
                                <div class="edit-group">
                                    <label class="edit-label">${field.label}</label>
                                    <input type="text" class="edit-input" 
                                        data-field="${field.id}" 
                                        value="${value}" 
                                        placeholder="${field.label}..."
                                        oninput="updateContent('${field.id}', this.value)">
                                </div>
                            `;
                        }
                    });
                    html += `</div>`;
                }
            } else if (tab === 'images') {
                const sections = {};
                config.fields.images.forEach(field => {
                    if (!sections[field.section]) sections[field.section] = [];
                    sections[field.section].push(field);
                });

                for (const [sectionName, fields] of Object.entries(sections)) {
                    html += `<div class="edit-section">`;
                    html += `<div class="edit-section-title"><i class="fas fa-images"></i> ${sectionName}</div>`;
                    fields.forEach(field => {
                        const currentUrl = siteData.images[field.id] || '';
                        html += `
                            <div class="edit-group">
                                <label class="edit-label">${field.label}</label>
                                <div class="image-upload">
                                    <i class="fas fa-cloud-upload-alt"></i>
                                    <div class="image-upload-text">اضغط لرفع صورة أو اسحب وأفلت</div>
                                    <input type="file" accept="image/*" onchange="handleImageUpload('${field.id}', this)">
                                </div>
                                <img class="image-preview ${currentUrl ? 'show' : ''}" id="preview-${field.id}" src="${currentUrl}" alt="${field.label}">
                            </div>
                        `;
                    });
                    html += `</div>`;
                }
            } else if (tab === 'settings') {
                html += `
                    <div class="edit-section">
                        <div class="edit-section-title"><i class="fas fa-globe"></i> إعدادات الموقع</div>
                        <div class="edit-group">
                            <label class="edit-label">اسم الموقع (للرابط)</label>
                            <input type="text" class="edit-input" id="siteSlug" placeholder="my-business" oninput="validateSlug(this)">
                            <small style="color:var(--gray);font-size:12px;margin-top:4px;display:block;">سيكون الرابط: taplify.com/s/<span id="slugPreview">your-site</span></small>
                        </div>
                        <div class="edit-group">
                            <label class="edit-label">اللغة الافتراضية</label>
                            <select class="edit-input" id="siteLang">
                                <option value="de">الألمانية</option>
                                <option value="ar">العربية</option>
                                <option value="en">الإنجليزية</option>
                            </select>
                        </div>
                    </div>
                    <div class="edit-section">
                        <div class="edit-section-title"><i class="fas fa-palette"></i> الألوان</div>
                        <div class="edit-group">
                            <label class="edit-label">اللون الرئيسي</label>
                            <div class="color-picker-wrapper">
                                <input type="color" class="color-picker" id="primaryColor" value="#1e3a5f" onchange="updateColor('primary', this.value)">
                                <span class="color-value" id="primaryColorValue">#1e3a5f</span>
                            </div>
                        </div>
                        <div class="edit-group">
                            <label class="edit-label">لون التأكيد</label>
                            <div class="color-picker-wrapper">
                                <input type="color" class="color-picker" id="accentColor" value="#c41e3a" onchange="updateColor('accent', this.value)">
                                <span class="color-value" id="accentColorValue">#c41e3a</span>
                            </div>
                        </div>
                    </div>
                    <div class="edit-section">
                        <div class="edit-section-title"><i class="fas fa-info-circle"></i> معلومات</div>
                        <div style="background:rgba(99,102,241,0.1);padding:16px;border-radius:12px;border:1px solid rgba(99,102,241,0.2);">
                            <p style="font-size:13px;color:var(--gray);line-height:1.8;">
                                <i class="fas fa-lightbulb" style="color:var(--primary);"></i> 
                                بعد النشر، سيحصل موقعك على رابط فريد وQR Code يمكنك مشاركته مع عملائك.
                            </p>
                        </div>
                    </div>
                `;
            }

            container.innerHTML = html;
        }

        function switchTab(tab) {
            document.querySelectorAll('.sidebar-tab').forEach(t => t.classList.remove('active'));
            event.target.closest('.sidebar-tab').classList.add('active');
            renderSidebar(tab);
        }

        // ===== CONTENT UPDATES =====
        function updateContent(fieldId, value) {
            siteData.content[fieldId] = value;
            updatePreview();
        }

        function updateColor(type, value) {
            document.getElementById(type + 'ColorValue').textContent = value;
            if (!siteData.colors) siteData.colors = {};
            siteData.colors[type] = value;
        }

        function validateSlug(input) {
            let slug = input.value.toLowerCase().replace(/[^a-z0-9-]/g, '-').replace(/-+/g, '-').replace(/^-|-$/g, '');
            input.value = slug;
            document.getElementById('slugPreview').textContent = slug || 'your-site';
            siteData.slug = slug;
        }

        // ===== IMAGE HANDLING =====
        function handleImageUpload(fieldId, input) {
            const file = input.files[0];
            if (!file) return;

            // Show preview
            const reader = new FileReader();
            reader.onload = function(e) {
                const preview = document.getElementById('preview-' + fieldId);
                if (preview) {
                    preview.src = e.target.result;
                    preview.classList.add('show');
                }

                // Store base64 for now (in production, upload to Firebase Storage)
                siteData.images[fieldId] = e.target.result;
                uploadedImages[fieldId] = e.target.result;

                updatePreview();
                showToast('تم رفع الصورة بنجاح!', 'success');
            };
            reader.readAsDataURL(file);
        }

        // ===== PREVIEW =====
        let previewDoc = null;

        function loadPreview() {
            const config = templateConfigs[currentTemplate];
            const frame = document.getElementById('previewFrame');

            fetch(config.file)
                .then(response => response.text())
                .then(html => {
                    frame.srcdoc = html;
                    frame.onload = function() {
                        previewDoc = frame.contentDocument || frame.contentWindow.document;
                        applyChanges();
                    };
                })
                .catch(err => {
                    console.error('Error loading template:', err);
                    frame.srcdoc = '<html><body style="display:flex;align-items:center;justify-content:center;height:100vh;font-family:sans-serif;color:#666;"><h2>جاري تحميل القالب...</h2></body></html>';
                });
        }

        function updatePreview() {
            if (!previewDoc) return;
            applyChanges();
        }

        function applyChanges() {
            if (!previewDoc) return;

            // Apply text content
            for (const [fieldId, value] of Object.entries(siteData.content)) {
                if (value) {
                    const elements = previewDoc.querySelectorAll(`[data-editable="${fieldId}"]`);
                    elements.forEach(el => {
                        if (el.tagName === 'INPUT' || el.tagName === 'TEXTAREA') {
                            el.placeholder = value;
                        } else if (el.tagName === 'A' && el.href && el.href.includes('tel:')) {
                            el.href = 'tel:' + value.split(' ').join('');
                            el.textContent = value;
                        } else if (el.tagName === 'A' && el.href && el.href.includes('mailto:')) {
                            el.href = 'mailto:' + value;
                            el.textContent = value;
                        } else {
                            el.textContent = value;
                        }
                    });
                }
            }

            // Apply images
            for (const [fieldId, url] of Object.entries(siteData.images)) {
                if (url) {
                    const elements = previewDoc.querySelectorAll(`[data-editable="${fieldId}"]`);
                    elements.forEach(el => {
                        if (el.tagName === 'IMG') {
                            el.src = url;
                        }
                    });
                }
            }

            // Apply colors
            if (siteData.colors) {
                if (siteData.colors.primary) {
                    previewDoc.documentElement.style.setProperty('--primary', siteData.colors.primary);
                }
                if (siteData.colors.accent) {
                    previewDoc.documentElement.style.setProperty('--accent', siteData.colors.accent);
                }
            }
        }

        function refreshPreview() {
            loadPreview();
            showToast('تم تحديث المعاينة', 'success');
        }

        function setDevice(device) {
            const frame = document.getElementById('previewFrame');
            frame.className = 'preview-frame ' + device;

            document.querySelectorAll('.device-btn').forEach(btn => btn.classList.remove('active'));
            event.target.closest('.device-btn').classList.add('active');
        }

        // ===== SAVE & PUBLISH =====
        async function saveAndPublish() {
            const btn = document.getElementById('saveBtn');
            btn.disabled = true;
            btn.classList.add('loading');
            btn.innerHTML = '<i class="fas fa-spinner"></i> جاري الحفظ...';

            try {
                // Generate slug if not set
                if (!siteData.slug) {
                    siteData.slug = 'site-' + Math.random().toString(36).substr(2, 8);
                }

                // Save to Firebase
                const siteRef = database.ref('sites/' + siteId);
                await siteRef.set(siteData);

                // Generate URL
                const baseUrl = window.location.origin;
                const siteUrl = baseUrl + '/s/' + siteData.slug;

                // Show success modal with QR
                showSuccessModal(siteUrl);

                showToast('تم حفظ ونشر الموقع بنجاح!', 'success');
            } catch (error) {
                console.error('Error saving:', error);
                showToast('حدث خطأ أثناء الحفظ. حاول مرة أخرى.', 'error');
            } finally {
                btn.disabled = false;
                btn.classList.remove('loading');
                btn.innerHTML = '<i class="fas fa-check-circle"></i> حفظ ونشر الموقع';
            }
        }

        function showSuccessModal(url) {
            const modal = document.getElementById('successModal');
            const qrContainer = document.getElementById('qrCodeContainer');
            const urlEl = document.getElementById('siteUrl');

            urlEl.textContent = url;

            // Generate QR Code
            qrContainer.innerHTML = '';
            new QRCode(qrContainer, {
                text: url,
                width: 180,
                height: 180,
                colorDark: '#1e3a5f',
                colorLight: '#ffffff',
                correctLevel: QRCode.CorrectLevel.H
            });

            modal.classList.add('show');
        }

        function closeModal() {
            document.getElementById('successModal').classList.remove('show');
        }

        function copyUrl() {
            const url = document.getElementById('siteUrl').textContent;
            navigator.clipboard.writeText(url).then(() => {
                showToast('تم نسخ الرابط!', 'success');
            });
        }

        // ===== TOAST =====
        function showToast(message, type) {
            const toast = document.getElementById('toast');
            const msgEl = document.getElementById('toastMessage');

            toast.className = 'toast ' + type;
            msgEl.textContent = message;

            // Update icon
            const icon = toast.querySelector('i');
            if (type === 'success') {
                icon.className = 'fas fa-check-circle';
            } else if (type === 'error') {
                icon.className = 'fas fa-exclamation-circle';
            }

            toast.classList.add('show');

            setTimeout(() => {
                toast.classList.remove('show');
            }, 3000);
        }

        // ===== CLOSE MODAL ON CLICK OUTSIDE =====
        document.getElementById('successModal').addEventListener('click', function(e) {
            if (e.target === this) {
                closeModal();
            }
        });

        // ===== LIVE PREVIEW =====
        function openLivePreview() {
            const config = templateConfigs[currentTemplate];

            // Fetch the template HTML
            fetch(config.file)
                .then(response => response.text())
                .then(html => {
                    // Create a new window for live preview
                    const previewWindow = window.open('', '_blank');

                    // Apply all current changes to the HTML
                    let modifiedHtml = html;

                    // Apply text content changes - use DOM manipulation approach for reliability
                    const tempDiv = document.createElement('div');
                    tempDiv.innerHTML = modifiedHtml;

                    // Apply text content changes
                    for (const [fieldId, value] of Object.entries(siteData.content)) {
                        if (value) {
                            const elements = tempDiv.querySelectorAll('[data-editable="' + fieldId + '"]');
                            elements.forEach(el => {
                                if (el.tagName === 'INPUT' || el.tagName === 'TEXTAREA') {
                                    el.placeholder = value;
                                } else if (el.tagName === 'A' && el.getAttribute('href') && el.getAttribute('href').includes('tel:')) {
                                    el.setAttribute('href', 'tel:' + value.split(' ').join(''));
                                    el.textContent = value;
                                } else if (el.tagName === 'A' && el.getAttribute('href') && el.getAttribute('href').includes('mailto:')) {
                                    el.setAttribute('href', 'mailto:' + value);
                                    el.textContent = value;
                                } else if (el.tagName === 'TITLE') {
                                    el.textContent = value;
                                } else {
                                    el.textContent = value;
                                }
                            });
                        }
                    }

                    // Apply image changes
                    for (const [fieldId, url] of Object.entries(siteData.images)) {
                        if (url) {
                            const elements = tempDiv.querySelectorAll('[data-editable="' + fieldId + '"][data-type="image"]');
                            elements.forEach(el => {
                                if (el.tagName === 'IMG') {
                                    el.src = url;
                                }
                            });
                        }
                    }

                    // Apply colors to CSS
                    if (siteData.colors) {
                        const styleEl = tempDiv.querySelector('style');
                        if (styleEl) {
                            let css = styleEl.textContent;
                            if (siteData.colors.primary) {
                                css = css.replace(/--primary: [^;]+;/g, '--primary: ' + siteData.colors.primary + ';');
                            }
                            if (siteData.colors.accent) {
                                css = css.replace(/--accent: [^;]+;/g, '--accent: ' + siteData.colors.accent + ';');
                            }
                            styleEl.textContent = css;
                        }
                    }

                    // Get the modified HTML
                    modifiedHtml = tempDiv.innerHTML;

                    // Write to new window
                    previewWindow.document.open();
                    previewWindow.document.write(modifiedHtml);
                    previewWindow.document.close();

                    showToast('تم فتح المعاينة في نافذة جديدة!', 'success');
                })
                .catch(err => {
                    console.error('Error loading preview:', err);
                    showToast('حدث خطأ في فتح المعاينة', 'error');
                });
        }

        // ===== INIT =====
        window.addEventListener('DOMContentLoaded', init);
    </script>
