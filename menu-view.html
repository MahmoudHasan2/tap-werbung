<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Speisekarte</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        html, body { width: 100%; height: 100%; overflow: hidden; background: #1a1a1a; }
        #loading {
            position: fixed; inset: 0;
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            background: #1a1a1a; color: rgba(255,255,255,0.5);
            font-family: sans-serif; font-size: 14px; gap: 16px; z-index: 10;
        }
        .spinner { width: 40px; height: 40px; border: 3px solid rgba(255,255,255,0.1); border-top-color: #8B5CF6; border-radius: 50%; animation: spin 0.8s linear infinite; }
        @keyframes spin { to { transform: rotate(360deg); } }
        #notFound {
            display: none; position: fixed; inset: 0;
            flex-direction: column; align-items: center; justify-content: center;
            background: #1a1a1a; color: rgba(255,255,255,0.5);
            font-family: sans-serif; text-align: center; gap: 12px;
        }
        #notFound h2 { color: white; font-size: 20px; }
    </style>
</head>
<body>
    <div id="loading">
        <div class="spinner"></div>
        <span>Speisekarte wird geladen…</span>
    </div>
    <div id="notFound">
        <h2>Speisekarte nicht gefunden</h2>
        <p>Diese Speisekarte existiert nicht oder wurde entfernt.</p>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/9.22.0/firebase-app.js";
        import { getDatabase, ref, get } from "https://www.gstatic.com/firebasejs/9.22.0/firebase-database.js";

        const app = initializeApp({ databaseURL: "https://your-firebase-project-default-rtdb.europe-west1.firebasedatabase.app" });
        const db  = getDatabase(app);

        function showNotFound() {
            document.getElementById('loading').style.display = 'none';
            document.getElementById('notFound').style.display = 'flex';
        }

        async function loadMenu() {
            const id = new URLSearchParams(window.location.search).get('id');

            if (!id) {
                showNotFound();
                return;
            }

            try {
                console.log('Looking for menu:', id);
                const snap = await get(ref(db, 'menus/' + id));

                if (!snap || !snap.exists()) {
                    console.log('Menu not found in Firebase');
                    showNotFound();
                    return;
                }

                const data = snap.val();
                console.log('Menu data:', data);

                const url = data.menuFileUrl;
                if (!url) {
                    console.log('No menuFileUrl found');
                    showNotFound();
                    return;
                }

                console.log('Redirecting to:', url);
                window.location.replace(url);

            } catch(e) {
                console.error('Error:', e);
                showNotFound();
            }
        }

        loadMenu();
    </script>
</body>
</html>
